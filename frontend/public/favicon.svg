<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Blue Intelligence — three-wave sigil (favicon).
       Dark navy square background + three cyan waves (matches the Waves lucide icon
       used in the app header). Rounded corners for macOS/iOS bookmark tiles. -->
  <defs>
    <linearGradient id="bi-wave-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#00e0ff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#33ccff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="bi-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.9"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="12" ry="12" fill="#020617"/>
  <g fill="none" stroke="url(#bi-wave-grad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#bi-glow)">
    <!-- top wave -->
    <path d="M8 22 C 14 18, 18 26, 24 22 S 34 18, 40 22 S 50 26, 56 22"/>
    <!-- middle wave (brightest) -->
    <path d="M8 32 C 14 28, 18 36, 24 32 S 34 28, 40 32 S 50 36, 56 32" opacity="0.98"/>
    <!-- bottom wave (softest) -->
    <path d="M8 42 C 14 38, 18 46, 24 42 S 34 38, 40 42 S 50 46, 56 42" opacity="0.85"/>
  </g>
</svg>
