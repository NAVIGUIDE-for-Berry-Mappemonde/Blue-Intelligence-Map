# Configuration SearXNG minimale pour Blue Intelligence.
# - format json activé (requis par le pipeline PoE : /search?format=json)
# - limiter désactivé (instance privée, pas de Valkey/Redis)
# - duckduckgo / brave / wikipedia : moteurs sans clés API
# - google / bing désactivés : sans clés ils échouent souvent et vident les results
use_default_settings: true

general:
  instance_name: "Blue Intelligence SearXNG"
  enable_metrics: false

server:
  secret_key: "blue-intelligence-change-me"
  limiter: false
  public_instance: false
  bind_address: "127.0.0.1"
  port: 8888

search:
  safe_search: 0
  default_lang: "en"
  formats:
    - html
    - json

valkey:
  url: false

engines:
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: wikipedia
    disabled: false
  - name: wikidata
    disabled: false
  - name: mojeek
    disabled: false
  - name: google
    disabled: true
  - name: bing
    disabled: true
