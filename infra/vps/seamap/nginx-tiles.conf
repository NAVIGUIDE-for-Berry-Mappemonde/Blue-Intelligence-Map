# Miroir carte marine — à inclure DANS le bloc `server { … }` HTTPS de
# /etc/nginx/sites-available/blue-intelligence (voir README.md de ce dossier).
#
# Sert /srv/tiles/seamap/public/ sous https://blueintelligence.online/tiles/seamap/ :
#   - current.pmtiles  → lu par plages d'octets (Range) par le protocole pmtiles://
#     du frontend ; nginx gère les Range nativement sur les fichiers statiques.
#   - style.json / VERSION → pointeurs, cache court pour suivre les builds hebdo.
#   - sprites/         → planche d'icônes nautiques (CC-BY, openwatersio/seamap).

location /tiles/seamap/ {
    alias /srv/tiles/seamap/public/;

    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Pointeurs (style.json, VERSION, current.pmtiles) : cache court —
    # le contenu change à chaque build hebdomadaire amont.
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;

    types {
        application/json json;
        image/png png;
    }
    default_type application/octet-stream;
}
