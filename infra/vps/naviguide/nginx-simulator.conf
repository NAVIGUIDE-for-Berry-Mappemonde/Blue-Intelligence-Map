# Site nginx séparé — simulator.naviguide.fr
# Ne PAS fusionner dans sites-available/naviguide : www.naviguide.fr reste
# intact (API :9000 / polar+chat :9004 / orchestrateur :9008).
#
# TLS : même certificat Let's Encrypt que le site skipper
# (/etc/letsencrypt/live/naviguide.fr/) une fois étendu au SAN
# simulator.naviguide.fr (certbot --expand, voir deploy-simulator.sh).
#
# Frontend : /var/www/naviguide-simulator (copie du dist/). Ne pas servir
# depuis ~/blue-intelligence-map/… (même leçon que /var/www/naviguide).

server {
    listen 443 ssl;
    server_name simulator.naviguide.fr;

    ssl_certificate /etc/letsencrypt/live/naviguide.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naviguide.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/naviguide-simulator;
    index index.html;
    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;

    # searoute + météo + proxys carto — backend simulateur (:8010), pas :9000
    # /route.geojson n'est pas matché (point après route) → fichier statique
    location ~ ^/(route|wind|wave|current|proxy)(/|$) {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
    }

    # polar simulateur (upload / VMG, sans chat) — pas naviguide-polar :9004
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
    }

    # couches Blue Intelligence en lecture (même VPS)
    location /bi/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}

# HTTP : challenge Let's Encrypt + redirection HTTPS
server {
    listen 80;
    server_name simulator.naviguide.fr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://simulator.naviguide.fr$request_uri;
    }
}
