# Copie de référence de /etc/nginx/sites-available/naviguide (VPS OVH).
# Version HTTP initiale : le TLS est ajouté par certbot après le premier déploiement :
#   sudo certbot --nginx -d www.naviguide.fr -d naviguide.fr
# Le frontend (dist/) est servi statiquement ; les API sont réparties par chemin
# sur les services NAVIGUIDE (127.0.0.1:9000/9004/9008) et Blue Intelligence (:8001).

# Canonique : www.naviguide.fr (les URLs VITE_* du build pointent sur www)
server {
    listen 80;
    server_name naviguide.fr;
    return 301 https://www.naviguide.fr$request_uri;
}

server {
    listen 80;
    server_name www.naviguide.fr;

    root /home/ubuntu/blue-intelligence-map/naviguide/naviguide-app/dist;
    index index.html;
    client_max_body_size 25m;   # upload polaires PDF/CSV/XLSX

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;

    # ── naviguide-api : routage, météo, simulation, agents SSE, proxys carto ──
    location ~ ^/(route|wind|wave|current|simulation|agents|proxy)(/|$) {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;        # SSE (agents IA)
        proxy_read_timeout 3600;
    }

    # ── polar-api : upload / analyse des polaires ─────────────────────────────
    location /api/v1/polar/ {
        proxy_pass http://127.0.0.1:9004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
    }

    # ── orchestrateur : briefing IA LangGraph (~30 s) ─────────────────────────
    location /api/v1/ {
        proxy_pass http://127.0.0.1:9008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
    }

    # ── Blue Intelligence (même VPS) : /bi/* → uvicorn BI /api/* ──────────────
    location /bi/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # ── SPA React (MapLibre) ──────────────────────────────────────────────────
    location / {
        try_files $uri /index.html;
    }
}
