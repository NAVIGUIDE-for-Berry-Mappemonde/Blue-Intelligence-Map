# Copie de référence de /etc/nginx/sites-available/naviguide (VPS OVH).
# TLS : certificat Let's Encrypt existant /etc/letsencrypt/live/naviguide.fr/
# (SAN : naviguide.fr + www.naviguide.fr), renouvelé par certbot (plugin nginx).
# Canonique : www.naviguide.fr — l'apex et le port 80 redirigent en 301.
# Frontend : /var/www/naviguide (copie de naviguide-app/dist/). Ne pas servir
# depuis ~/blue-intelligence-map/… : un rsync/chmod 700 du dépôt bloque
# www-data et nginx répond 500 (boucle try_files) au lieu de la SPA.
# Les API sont réparties par chemin sur 127.0.0.1:9000/9004/9008 et :8001.

server {
    listen 443 ssl;
    server_name www.naviguide.fr;

    ssl_certificate /etc/letsencrypt/live/naviguide.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/naviguide.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    root /var/www/naviguide;
    index index.html;
    client_max_body_size 25m;   # upload polaires PDF/CSV/XLSX

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;

    # ── naviguide-api : routage, météo, simulation, agents SSE, proxys carto ──
    location ~ ^/(route|wind|wave|current|simulation|agents|proxy)(/|$) {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;        # SSE (agents IA)
        proxy_read_timeout 3600;
    }

    # ── polar-api : upload / analyse des polaires ─────────────────────────────
    location /api/v1/polar/ {
        proxy_pass http://127.0.0.1:9004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
    }

    # ── orchestrateur : briefing IA LangGraph (~30 s) ─────────────────────────
    location /api/v1/ {
        proxy_pass http://127.0.0.1:9008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
    }

    # ── Fond marin Seamap (miroir local, même VPS que Blue Intelligence) ──────
    location /tiles/seamap/ {
        alias /srv/tiles/seamap/public/;
        add_header Access-Control-Allow-Origin "*" always;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        types {
            application/json json;
            image/png png;
        }
        default_type application/octet-stream;
    }

    # ── Blue Intelligence (même VPS) : /bi/* → uvicorn BI /api/* ──────────────
    location /bi/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # ── SPA React (MapLibre) ──────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html =404;
    }
}

# Apex → www (canonique)
server {
    listen 443 ssl;
    server_name naviguide.fr;

    ssl_certificate /etc/letsencrypt/live/naviguide.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/naviguide.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://www.naviguide.fr$request_uri;
}

# HTTP → HTTPS www
server {
    listen 80;
    server_name naviguide.fr www.naviguide.fr;
    return 301 https://www.naviguide.fr$request_uri;
}
