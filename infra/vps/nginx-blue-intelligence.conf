# Copie de référence de /etc/nginx/sites-available/blue-intelligence (VPS OVH).
# Les lignes TLS (certificat Let's Encrypt) sont gérées par certbot — ne pas
# recopier ce fichier tel quel sans elles. L'application (UI + /api/*) est
# entièrement servie par uvicorn sur 127.0.0.1:8001 (SERVE_FRONTEND=1).
server {
    server_name blueintelligence.online www.blueintelligence.online;
    client_max_body_size 25m;   # imports GeoJSON (seed projets ≈ 3,4 Mo)

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/blueintelligence.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/blueintelligence.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.blueintelligence.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = blueintelligence.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name blueintelligence.online www.blueintelligence.online;
    return 404; # managed by Certbot
}
